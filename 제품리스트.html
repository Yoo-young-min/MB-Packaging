 <!-- 행 자동 생성, 1500숫자를 변경하면 행 숫자 변경 가능 -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tbody = document.getElementById("orderTable");

      for (let i = 0; i < 1500; i++) {
        let row = "<tr>";

        for (let j = 0; j < 14; j++) {  // 14개 열
          row += "<td contenteditable='true'></td>";
        }

        row += "</tr>";
        tbody.innerHTML += row;
      }

      document.getElementById("orderTable").addEventListener("paste", function(e){
  e.preventDefault();

  const text = (e.clipboardData || window.clipboardData).getData("text");
  const rows = text.split(/\r?\n/);
  
  const startCell = document.activeElement;
  const startRow = startCell.parentElement.rowIndex - 1; 
  const startCol = startCell.cellIndex;

  rows.forEach((rowText, i) => {
    if(!rowText) return;
    const cols = rowText.split("\t");
    const row = document.querySelectorAll("#orderTable tr")[startRow + i];
    if(!row) return;

    cols.forEach((colText, j) => {
      const cell = row.cells[startCol + j];
      if(cell){
        cell.innerText = colText.trim();
        
        // 🔹 붙여넣기 후 바로 이벤트 발생
        cell.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  });
});

    });

    
  </script>

<!-- 별도 입력 기능, 커서 자유 이동 -->
<script>
document.getElementById("orderTable").addEventListener("keydown", function(e) {

  const cell = document.activeElement;
  if (cell.tagName !== "TD") return;

  const row = cell.parentElement;
  const rowIndex = row.rowIndex - 1;
  const colIndex = cell.cellIndex;

  let target;

  switch(e.key) {
    case "ArrowRight":
      target = row.cells[colIndex + 1];
      break;
    case "ArrowLeft":
      target = row.cells[colIndex - 1];
      break;
    case "ArrowDown":
      target = row.nextElementSibling?.cells[colIndex];
      break;
    case "ArrowUp":
      target = row.previousElementSibling?.cells[colIndex];
      break;
    case "Enter":
      e.preventDefault();
      target = row.nextElementSibling?.cells[colIndex];
      break;
    case "Tab":
      e.preventDefault();
      target = row.cells[colIndex + 1] ||
               row.nextElementSibling?.cells[0];
      break;
  }

  if (target) {
    target.focus();
  }
});
</script>

<!-- 1000단위 콤마 자동 적용 -->
<script>
document.getElementById("orderTable").addEventListener("blur", function(e) {
  const cell = e.target;
  if (cell.tagName !== "TD") return;

  const colIndex = cell.cellIndex;

  // 6,7,8,10번 열에 적용 (0부터 시작)
  if (colIndex === 4 || colIndex === 5 || colIndex === 6 || colIndex === 7) {
    let value = cell.innerText.replace(/,/g, "").trim();

    if (!isNaN(value) && value !== "") {
      cell.innerText = Number(value).toLocaleString();
    }
  }
}, true);
</script>


<!-- 마지막 열까지 하이라이트 적용 -->
<script>
document.getElementById("orderTable").addEventListener("focusin", function(e) {

  if (e.target.tagName !== "TD") return;

  const colIndex = e.target.cellIndex;

  // 👉 마지막 열까지 활성화 (0~13)
  if (colIndex > 13) return;

  // 기존 선택 제거
  document.querySelectorAll("#orderTable tr").forEach(row => {
    row.classList.remove("selected-row");
  });

  // 현재 행 선택
  e.target.parentElement.classList.add("selected-row");
});
</script>


<!-- 수량, 단가, 금액 숫자 수정시 한번에 수정하기 -->
<script>
const table = document.getElementById("orderTable");

// 숫자 열 (기존)
const numberColumns = [5,6,7];

// 1~5열 + 기존 숫자 열
const editableColumns = [0,1,2,3,4,5,6,7];

table.addEventListener("focusin", function(e) {
  if(e.target.tagName !== 'TD') return;
  const colIndex = e.target.cellIndex;

  if(editableColumns.includes(colIndex)) {
    // 전체 텍스트 선택
    setTimeout(() => {
      const range = document.createRange();
      range.selectNodeContents(e.target);

      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }, 0);
  }

  // 행 하이라이트
  document.querySelectorAll("#orderTable tr").forEach(row=>{
    row.classList.remove("selected-row");
  });
  e.target.parentElement.classList.add("selected-row");
});
</script>

<!-- 합계 열 금액 합산 기능 -->
<script>
const tableBody = document.getElementById("orderTable");
const grandTotalEl = document.getElementById("grandTotal");

// 합계 열 인덱스 (0부터 시작 → 8번째 열이면 7)
const totalColumnIndex = 7;

function calculateGrandTotal() {
  let sum = 0;

  const rows = tableBody.querySelectorAll("tr"); // tbody 안의 행만 가져오기

  rows.forEach(row => {
    const cell = row.cells[totalColumnIndex];
    if (!cell) return;

    // 콤마 제거 후 숫자로 변환
    let value = cell.innerText.replace(/,/g, "").trim();
    if (value !== "" && !isNaN(value)) {
      sum += Number(value);
    }
  });

  grandTotalEl.innerText = sum.toLocaleString();
}

// 값 수정 후 자동 재계산
tableBody.addEventListener("blur", function(e) {
  if (e.target.tagName === "TD") {
    calculateGrandTotal();
  }
}, true);

// 최초 실행
calculateGrandTotal();
</script>



<!-- 데이터 저장하기 -->
<script>
function getLeftTableData() {
  const table = document.getElementById("orderTable");
  const rows = table.querySelectorAll("tr");
  const data = [];

  rows.forEach(row => {
    const rowData = [];
    row.querySelectorAll("td").forEach(cell => {
      rowData.push(cell.innerText.trim());
    });
    if (rowData.some(cell => cell !== "")) {
      data.push(rowData);
    }
  });

  return data;
}

function getRightTableData() {
  const inputs = document.querySelectorAll(".side-table input");
  const data = [];

  inputs.forEach(input => {
    data.push(input.value);
  });

  return data;
}

function saveTableData() {
  const saveData = {
    leftTable: getLeftTableData(),
    rightTables: getRightTableData()
  };

  localStorage.setItem("productPageData", JSON.stringify(saveData));
  alert("저장되었습니다 👍");
}
</script>


<!-- 데이터 다운로드 -->
<script>
function downloadTableData() {
  const data = getTableData();

  if (data.length === 0) {
    alert("저장할 데이터가 없습니다.");
    return;
  }

  let csvContent = "";

  data.forEach(row => {
    csvContent += row.map(cell => `"${cell}"`).join(",") + "\n";
  });

  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = "주문데이터.csv";
  link.click();
}
</script>

<!-- 우측 테이블들 숫자 1000단위 콤마, 화살표 이동  -->
<script>

// ① 콤마 기능
document.querySelectorAll('.number-input').forEach(input => {

  input.addEventListener('input', function () {

    let value = this.value.replace(/,/g, '');

    if (!/^\d*\.?\d*$/.test(value)) return;

    if (value === '') {
      this.value = '';
      return;
    }

    let parts = value.split('.');
    parts[0] = Number(parts[0]).toLocaleString();

    this.value = parts.join('.');
  });

  input.addEventListener('focus', function () {
    this.select();
  });

});


// 🔥 ② 여기 아래에 방향키로 자유 이동

document.querySelectorAll('.side-table').forEach(table => {
  const inputs = table.querySelectorAll('input');

  inputs.forEach((input) => {
    input.addEventListener('keydown', function (e) {
      const allInputs = Array.from(table.querySelectorAll('input'));
      const index = allInputs.indexOf(this);

      let nextInput;
      switch(e.key) {
        case "ArrowRight":
          nextInput = allInputs[index + 1];
          break;
        case "ArrowLeft":
          nextInput = allInputs[index - 1];
          break;
        case "ArrowDown":
          {
            const currentRow = this.closest('tr');
            const cellIndex = Array.from(currentRow.children).indexOf(this.parentElement);

            let nextRow = currentRow.nextElementSibling;
            while(nextRow && !nextRow.querySelectorAll('input')[cellIndex]) {
              nextRow = nextRow.nextElementSibling;
            }
            if(nextRow) nextInput = nextRow.querySelectorAll('input')[cellIndex];
          }
          break;
        case "ArrowUp":
          {
            const currentRow = this.closest('tr');
            const cellIndex = Array.from(currentRow.children).indexOf(this.parentElement);

            let prevRow = currentRow.previousElementSibling;
            while(prevRow && !prevRow.querySelectorAll('input')[cellIndex]) {
              prevRow = prevRow.previousElementSibling;
            }
            if(prevRow) nextInput = prevRow.querySelectorAll('input')[cellIndex];
          }
          break;
      }

      if(nextInput) {
        e.preventDefault();
        nextInput.focus();
      }
    });
  });
});

</script>


<!-- 좌측 테이블 CBM 자동 계산식  -->
<script>
const orderTable = document.getElementById('orderTable');

function calculateCBM(row){
  if(!row) return;

  // 6~8열: 가로, 세로, 높이 (0-based)
  let w = row.children[6].innerText.replace(/,/g,'').trim();
  let l = row.children[7].innerText.replace(/,/g,'').trim();
  let h = row.children[8].innerText.replace(/,/g,'').trim();

  w = parseFloat(w) || 0;
  l = parseFloat(l) || 0;
  h = parseFloat(h) || 0;

  const cbmCell = row.children[9]; // CBM 표시
  if(w>0 && l>0 && h>0){
    const cbm = (w/1000)*(l/1000)*(h/1000); // mm → m
    cbmCell.textContent = cbm.toFixed(6);
  } else {
    cbmCell.textContent = '';
  }
}

// 붙여넣기 포함 input 이벤트
orderTable.addEventListener('input', function(e){
  const row = e.target.closest('tr');
  setTimeout(()=>calculateCBM(row), 0);
});

// blur 이벤트도 추가 (혹시 놓친 경우 대비)
orderTable.addEventListener('blur', function(e){
  const row = e.target.closest('tr');
  calculateCBM(row);
}, true);

// 🔹 페이지 로드 시 기존 값 계산
document.addEventListener('DOMContentLoaded', function(){
  const rows = orderTable.querySelectorAll('tr');
  rows.forEach(row => calculateCBM(row));
});


// 쇼핑몰 vs 이카운트 비교 '다름' 표시
function updateCompare(row) {
  if(!row) return;

  const shopName = row.children[0].innerText.trim();
  const ecountName = row.children[3].innerText.trim();
  const compareCell = row.children[2]; // 비교 열

  if(shopName === '' && ecountName === '') {
    compareCell.innerText = '';
  } else if(shopName === ecountName) {
    compareCell.innerText = '';
  } else {
    compareCell.innerText = '다름';
    compareCell.style.color = 'red';        // 항상 빨간색
    compareCell.style.fontWeight = '400';   // 보통 글꼴
  }
}

// 입력 시마다 호출
document.getElementById("orderTable").addEventListener("input", function(e){
  const row = e.target.closest('tr');
  updateCompare(row);
});

// 붙여넣기 후에도 호출
document.getElementById("orderTable").addEventListener("paste", function(e){
  setTimeout(() => { // 붙여넣기 처리 후
    const rows = document.querySelectorAll("#orderTable tr");
    rows.forEach(row => updateCompare(row));
  }, 0);
});

// 페이지 로드 시 기존 데이터에도 적용
document.addEventListener("DOMContentLoaded", function(){
  const rows = document.querySelectorAll("#orderTable tr");
  rows.forEach(row => updateCompare(row));
});


// 기존 비교 열에 '다름' 있는 경우 빨간색 + 보통 글꼴 적용
function applyCompareHighlight() {
  const rows = document.querySelectorAll("#orderTable tr");
  rows.forEach(row => {
    const compareCell = row.children[2]; // 비교 열
    if (compareCell && compareCell.innerText.trim().toLowerCase() === '다름') {
      compareCell.style.color = 'red';
      compareCell.style.fontWeight = '400'; // 보통 글꼴
    }
  });
}

// 페이지 로드 시 적용
document.addEventListener("DOMContentLoaded", function() {
  applyCompareHighlight();
});



// 셀 자체 복사, 붙여넣기 기능 //
let copiedCellContent = '';

document.getElementById('orderTable').addEventListener('keydown', function(e){
  const cell = document.activeElement;
  if(cell.tagName !== 'TD') return;

  // 복사
  if(e.ctrlKey && e.key === 'c') {
    e.preventDefault();
    copiedCellContent = cell.innerText;
  }

  // 붙여넣기
  if(e.ctrlKey && e.key === 'v') {
    e.preventDefault();
    if(copiedCellContent !== '') {
      cell.innerText = copiedCellContent;
      cell.dispatchEvent(new Event('input')); // 비교/CBM 등 반영
    }
  }
});


</script>




<!-- 테이블에 제품리스트 보이게 -->
<script>
function loadAllData() {
  const saved = localStorage.getItem("productPageData");
  if (!saved) return;

  const data = JSON.parse(saved);

  // 왼쪽 테이블 복원
  const rows = document.querySelectorAll("#orderTable tr");
  data.leftTable.forEach((rowData, i) => {
    if (!rows[i]) return;
    rowData.forEach((cellData, j) => {
      rows[i].cells[j].innerText = cellData;
    });
  });

  // 오른쪽 테이블 복원
  const inputs = document.querySelectorAll(".side-table input");
  inputs.forEach((input, i) => {
    if (data.rightTables[i] !== undefined) {
      input.value = data.rightTables[i];
    }
  });
}

// 페이지 로드시 실행
document.addEventListener("DOMContentLoaded", function () {
  loadAllData();
});
</script>
