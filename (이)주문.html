<!DOCTYPE html>
<html>
<head>
  <title>MB Packaging</title>
  <meta charset="utf-8" />

  <style>
    body {
      font-family: Arial;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    /* 상단 바 (버튼 + 시계 한 줄 정렬) */
    .top-bar {
      width: 95%;
      margin: 10px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 보내기 버튼 (녹색) */
    .send-btn {
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
    }

    .send-btn:hover {
      background-color: #218838;
    }

    /* 시계 */
    #clock {
      font-size: 15px;
      color: #0e0d0d;
    }

    /* 테이블 스크롤 영역, th, td는 폰트 조정 */
    .table-wrapper {
      width: 95%;
      height: 750px;   /* 화면에 보여지는 세로 크기 */
      overflow-y: auto;
      margin: auto;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
      font-size: 13px;      /* 테이블내 데이터 글자 크기 */
      font-weight: 400;     /* 굵기 (400=보통, 500=중간, 600=굵게) */
      color: #070707;          /* 글자 색 */
    }
    td:focus {
      outline: 2px solid #4CAF50;   /* 클릭했을 때 테두리 */
      background-color: #f0fff4;    /* 선택 시 배경 */
    }
    td:nth-child(4),
    td:nth-child(5) {
      text-align: left;
      padding-left: 10px;
    }

    th:nth-child(1) { width: 9%; }   /* 주문자 */
    th:nth-child(2) { width: 8%; }  /* 휴대폰 */
    th:nth-child(3) { width: 8%; }  /* 전화 */
    th:nth-child(4) { width: 20%; }  /* 주소 */
    th:nth-child(5) { width: 18%; }  /* 품목 */
    th:nth-child(6) { width: 5%; }   /* 수량 */
    th:nth-child(7) { width: 6%; }  /* 금액 */
    th:nth-child(8) { width: 7%; }  /* 합계 */
    th:nth-child(9) { width: 15%; }  /* 기타 */


    /* 테이블 헤더 고정, 폰트 조정 */
    thead th {
      position: sticky;
      top: 0;
      background-color: powderblue;
      z-index: 2;

      font-size: 16px;      /* 글자 크기 */
      font-weight: 400;     /* 굵기 줄임 */
      letter-spacing: 1px;  /* 글자 간격 */
      padding: 7px 7px;    /* 위아래 여백 */
    }

    tr:hover {
      background-color: #f5f5f5;
    }

    tr.selected-row {
      background-color: #e8f5e9 !important; /* 선택 행 전체 하이라이트 */
    }
  </style>
</head>

<body>

  <h1>이카운트 주문 현황</h1>

  <!-- 버튼 + 시계 -->
  <div class="top-bar">
    <a href="발송 선택.html">
      <button class="send-btn"><strong>보내기</strong></button>
    </a>

    <div id="clock"></div>
  </div>

  <!-- 테이블 -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>주 문 자</th>
          <th>휴 대 폰</th>
          <th>전 화</th>
          <th>주&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;소</th>
          <th>품&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;목</th>
          <th>수 량</th>
          <th>금 액</th>
          <th>
            합계
             <div id="grandTotal"
                  style="font-size:12px; color:red; font-weight:400; margin-top:4px;">
                0
             </div>
          </th>
          <th>기타 / 메모</th>
          <th style="font-size:13px; color:rgb(252, 6, 6);">실 수량</th> <!-- 새 열 추가 -->
        </tr>
      </thead>
      <tbody id="orderTable"></tbody>
    </table>
  </div>

  <!-- 시계 스크립트 -->
  <script>
    function clock() {
      var time = new Date();

      var month = time.getMonth() + 1;
      var date = time.getDate();
      var day = time.getDay();
      var week = ["일", "월", "화", "수", "목", "금", "토"];

      var hours = time.getHours();
      var minutes = time.getMinutes();
      var seconds = time.getSeconds();

      document.getElementById("clock").innerText =
        month + "월 " + date + "일 " + week[day] + "요일 " +
        (hours < 10 ? "0" + hours : hours) + ":" +
        (minutes < 10 ? "0" + minutes : minutes) + ":" +
        (seconds < 10 ? "0" + seconds : seconds);
    }

    clock();
    setInterval(clock, 1000);
  </script>

  <!-- 행 자동 생성, 300숫자를 변경하면 행 숫자 변경 가능 -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tbody = document.getElementById("orderTable");

      for (let i = 0; i < 300; i++) {
        let row = "<tr>";

        for (let j = 0; j < 10; j++) {  // 기존 9 → 새 열 추가 10
          row += "<td contenteditable='true'></td>";
        }

        row += "</tr>";
        tbody.innerHTML += row;
      }
    });
  </script>

<!-- 엑셀 복붙 기능 -->
  <script>
document.getElementById("orderTable").addEventListener("paste", function(e) {
  e.preventDefault();

  const text = (e.clipboardData || window.clipboardData).getData("text");
  const rows = text.split("\n");
  
  const startCell = document.activeElement;
  const startRow = startCell.parentElement.rowIndex - 1; 
  const startCol = startCell.cellIndex;

  rows.forEach((rowText, i) => {
    const cols = rowText.split("\t");
    cols.forEach((colText, j) => {
      const row = document.querySelectorAll("#orderTable tr")[startRow + i];
      if (row) {
        const cell = row.cells[startCol + j];
        if (cell) {
          cell.innerText = colText.trim();
        }
      }
    });
  });
});
</script>

<!-- 별도 입력 기능, 커서 자유 이동 -->
<script>
document.getElementById("orderTable").addEventListener("keydown", function(e) {

  const cell = document.activeElement;
  if (cell.tagName !== "TD") return;

  const row = cell.parentElement;
  const rowIndex = row.rowIndex - 1;
  const colIndex = cell.cellIndex;

  let target;

  switch(e.key) {
    case "ArrowRight":
      target = row.cells[colIndex + 1];
      break;
    case "ArrowLeft":
      target = row.cells[colIndex - 1];
      break;
    case "ArrowDown":
      target = row.nextElementSibling?.cells[colIndex];
      break;
    case "ArrowUp":
      target = row.previousElementSibling?.cells[colIndex];
      break;
    case "Enter":
      e.preventDefault();
      target = row.nextElementSibling?.cells[colIndex];
      break;
    case "Tab":
      e.preventDefault();
      target = row.cells[colIndex + 1] ||
               row.nextElementSibling?.cells[0];
      break;
  }

  if (target) {
    target.focus();
  }
});
</script>

<!-- 1000단위 콤마 자동 적용 -->
<script>
document.getElementById("orderTable").addEventListener("blur", function(e) {
  const cell = e.target;
  if (cell.tagName !== "TD") return;

  const colIndex = cell.cellIndex;

  // 6,7,8,10번 열에 적용 (0부터 시작)
  if (colIndex === 5 || colIndex === 6 || colIndex === 7 || colIndex === 9) {
    let value = cell.innerText.replace(/,/g, "").trim();

    if (!isNaN(value) && value !== "") {
      cell.innerText = Number(value).toLocaleString();
    }
  }
}, true);
</script>

<!-- 선택 행 전체 하이라이트 -->
<script>
 document.getElementById("orderTable").addEventListener("focusin", function(e) {

  if (e.target.tagName !== "TD") return;

  // 기존 선택 제거
  document.querySelectorAll("#orderTable tr").forEach(row => {
    row.classList.remove("selected-row");
  });

  // 현재 행 선택
  e.target.parentElement.classList.add("selected-row");
});
</script>

<!-- 수량, 단가, 금액 숫자 수정시 한번에 수정하기 -->
<script>
const table = document.getElementById("orderTable");

// 숫자 열 인덱스 (수량=6, 금액=7, 합계=8 → 0부터 시작하므로 5,6,7)
const numberColumns = [5, 6, 7];

table.addEventListener("focusin", function(e) {

  if (e.target.tagName !== "TD") return;

  const colIndex = e.target.cellIndex;

  if (numberColumns.includes(colIndex)) {

    // 약간의 딜레이 후 전체 선택
    setTimeout(() => {
      const range = document.createRange();
      range.selectNodeContents(e.target);

      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }, 0);
  }
});
</script>

<!-- 합계 열 금액 합산 기능 -->
<script>
const tableBody = document.getElementById("orderTable");
const grandTotalEl = document.getElementById("grandTotal");

// 합계 열 인덱스 (0부터 시작 → 8번째 열이면 7)
const totalColumnIndex = 7;

function calculateGrandTotal() {
  let sum = 0;

  const rows = tableBody.querySelectorAll("tr"); // tbody 안의 행만 가져오기

  rows.forEach(row => {
    const cell = row.cells[totalColumnIndex];
    if (!cell) return;

    // 콤마 제거 후 숫자로 변환
    let value = cell.innerText.replace(/,/g, "").trim();
    if (value !== "" && !isNaN(value)) {
      sum += Number(value);
    }
  });

  grandTotalEl.innerText = sum.toLocaleString();
}

// 값 수정 후 자동 재계산
tableBody.addEventListener("blur", function(e) {
  if (e.target.tagName === "TD") {
    calculateGrandTotal();
  }
}, true);

// 최초 실행
calculateGrandTotal();
</script>

<!-- 중복 체크 / 전번, 주소까지 동일하면 다른 주문 -->
<script>
function highlightDuplicateNames() {
  const rows = document.querySelectorAll("#orderTable tr");

  // 모든 주문자 데이터 수집
  const nameMap = {};

  rows.forEach(row => {
    const name = row.cells[0]?.innerText.trim();
    const phone = row.cells[1]?.innerText.trim();
    const address = row.cells[3]?.innerText.trim();

    if (!name) return;

    // 이름별 배열 생성
    if (!nameMap[name]) nameMap[name] = [];

    nameMap[name].push({ row, phone, address });
  });

  // 중복 체크
  Object.keys(nameMap).forEach(name => {
    const entries = nameMap[name];
    if (entries.length <= 1) return; // 한 번만 나타나면 OK

    // 여러 행 중 동일한 휴대폰 + 주소면 정상, 아니면 빨간색
    entries.forEach((entry, i) => {
      const duplicate = entries.some((other, j) => {
        if (i === j) return false;
        return entry.phone === other.phone && entry.address === other.address;
      });

      // 휴대폰, 주소가 다른 경우 → 빨간색
      if (!duplicate) {
        entry.row.cells[0].style.color = "red"; // 주문자 이름만 빨간색
      } else {
        entry.row.cells[0].style.color = "black"; // 정상이면 기본
      }
    });
  });
}

// 주문 테이블 변경 시마다 실행
document.getElementById("orderTable").addEventListener("blur", function(e) {
  if (e.target.tagName === "TD") {
    highlightDuplicateNames();
  }
}, true);

// 최초 실행
highlightDuplicateNames();
</script>

</body>
</html>
